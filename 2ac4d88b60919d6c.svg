<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">U-100 scale example</title><desc id="desc">An enlarged zero-to-thirty scale with two-unit increments. The needle-facing plunger edge aligns with twenty units, equivalent to zero point two zero milliliters on U-100.</desc><defs><linearGradient id="barrel" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#f5fbff"/><stop offset="1" stop-color="#e3f2fb"/></linearGradient><linearGradient id="liquid" x2="0" y2="1"><stop stop-color="#b8e6f7" stop-opacity=".35"/><stop offset="1" stop-color="#64bde3" stop-opacity=".65"/></linearGradient></defs><g font-family="Arial,sans-serif"><text x="62" y="58" font-size="25" fill="#597a90">Needle end</text><path d="M173 76H63m0 0 12-8m-12 8 12 8" fill="none" stroke="#6c9cb6" stroke-width="2.5" stroke-linecap="round"/><rect x="40" y="144" width="640" height="97" rx="16" fill="url(#barrel)" stroke="#7facc7" stroke-width="2.5"/><rect x="60" y="157" width="400" height="70" fill="url(#liquid)"/><rect x="460" y="157" width="33" height="70" rx="3" fill="#263f53"/><path d="M493 192h170" stroke="#c4d4df" stroke-width="20"/><path d="M60 151v30" stroke="#245370" stroke-width="3"/><text x="60" y="129" text-anchor="middle" font-size="31" font-weight="700" fill="#244d69">0</text><path d="M100 151v17" stroke="#245370" stroke-width="2"/><path d="M140 151v17" stroke="#245370" stroke-width="2"/><path d="M180 151v17" stroke="#245370" stroke-width="2"/><path d="M220 151v17" stroke="#245370" stroke-width="2"/><path d="M260 151v30" stroke="#245370" stroke-width="3"/><text x="260" y="129" text-anchor="middle" font-size="31" font-weight="700" fill="#244d69">10</text><path d="M300 151v17" stroke="#245370" stroke-width="2"/><path d="M340 151v17" stroke="#245370" stroke-width="2"/><path d="M380 151v17" stroke="#245370" stroke-width="2"/><path d="M420 151v17" stroke="#245370" stroke-width="2"/><path d="M460 151v30" stroke="#245370" stroke-width="3"/><text x="460" y="129" text-anchor="middle" font-size="31" font-weight="700" fill="#127bad">20</text><path d="M500 151v17" stroke="#245370" stroke-width="2"/><path d="M540 151v17" stroke="#245370" stroke-width="2"/><path d="M580 151v17" stroke="#245370" stroke-width="2"/><path d="M620 151v17" stroke="#245370" stroke-width="2"/><path d="M660 151v30" stroke="#245370" stroke-width="3"/><text x="660" y="129" text-anchor="middle" font-size="31" font-weight="700" fill="#244d69">30</text><path d="M460 280v-40" stroke="#e65a4b" stroke-width="3"/><path d="m460 231-7 12h14Z" fill="#e65a4b"/><text x="460" y="314" text-anchor="middle" font-size="27" font-weight="700" fill="#244d69">Read this edge</text></g></svg>
